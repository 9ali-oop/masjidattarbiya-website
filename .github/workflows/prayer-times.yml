name: Update prayer times

# Masjidbox is the masjid's own timetable and the single source of truth.
# We refresh a local copy daily so the site can render times in its own design
# instead of embedding a third-party widget.
on:
  schedule:
    - cron: "20 2 * * *"   # 02:20 UTC daily, before Fajr in the UK
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the timetable
        run: python scripts/fetch_prayer_times.py

      - name: Commit if the times changed
        run: |
          if git diff --quiet -- assets/prayer-times.json; then
            echo "No change to prayer times."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/prayer-times.json
          git commit -m "Update prayer times from Masjidbox"
          git push
