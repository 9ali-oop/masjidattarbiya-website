name: Update prayer times

# The masjid's printed monthly timetable is the source of truth (typed into
# scripts/timetable/YYYY-MM.txt); Masjidbox only fills a day no typed month covers.
# This rebuilds the coming week every night, then runs the data check, which fails
# (and emails the repository's owner) when the coming week needs a month that has
# not been typed yet.
on:
  schedule:
    - cron: "20 2 * * *"   # 02:20 UTC daily, before Fajr in the UK
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the timetable
        run: python scripts/fetch_prayer_times.py

      - name: Commit if the times changed
        run: |
          if git diff --quiet -- assets/prayer-times.json; then
            echo "No change to prayer times."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/prayer-times.json
          git commit -m "Update prayer times"
          git push

      - name: Check the times match the printed timetable
        run: python scripts/check_data.py
